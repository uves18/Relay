[project]
name = "relay"
version = "0.1.0"
description = "Distributed background job execution platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "celery>=5.5",
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pytest>=8.4",
    "python-dotenv>=1.1",
    "redis>=6.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

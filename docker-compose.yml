services:
  postgres:
    image: postgres:17
    container_name: relay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - relay_pgdata:/var/lib/postgresql/data
    networks:
      - relay_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: relay_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - relay_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: relay_api
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn relay.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RETRY_DELAY_SECONDS: ${CELERY_RETRY_DELAY_SECONDS:-5}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - relay_net

  worker:
    build: .
    container_name: relay_worker
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             celery -A relay.worker.celery_app worker --loglevel=info"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RETRY_DELAY_SECONDS: ${CELERY_RETRY_DELAY_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - relay_net

volumes:
  relay_pgdata:

networks:
  relay_net:
    driver: bridge
